<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta de CEP</title>
<style>
body { font-family: Arial; color:white; text-align: center; background: #0055ff; }
h1 {color:bisque}
input, button { padding: 10px; margin: 5px; border-radius: 8px; }
#resultado { margin-top: 20px; background: rgb(15, 15, 15); display: inline-block; padding: 20px; border-radius:
12px; box-shadow: 0 0 10px #ccc; text-align: left; }
</style>
</head>
<body>
<h1>Consulta de CEP</h1>
<input type="text" id="cep" placeholder="Digite o CEP">
<button id="buscar">Buscar</button>
<div id="resultado">
    <div class="campo">
        <span>Logradouro:</span>
        <strong id="lodoro">---</strong>
    </div>
    <div class="campo">
        <span>Bairro:</span>
        <strong id="bairro">---</strong>
    </div>
    <div class="campo">
        <span>Cidade:</span>
        <strong id="cidade">---</strong>
    </div>
    <div class="campo">
        <span>UF:</span>
        <strong id="uf">---</strong>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
